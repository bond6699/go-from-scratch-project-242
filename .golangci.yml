# .golangci.yml
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    # базовая корректность
    - errcheck
    - staticcheck
    - ineffassign
    - unused
    - unparam

    # ошибки и wrapping
    - errorlint
    - errname
    - nilerr
    - nilnil
    - nilnesserr

    # стиль и читаемость
    - revive
    - gocritic
    - goconst
    - misspell
    - nlreturn
    - wsl_v5

    # сложность
    - gocyclo
    - gocognit
    - nestif
    - dupl

    # ресурсы / context
    - bodyclose
    - noctx
    - durationcheck

    # тесты
    - testifylint
    - thelper

    # современный Go
    - modernize
    - usestdlibvars
    - intrange

  settings:
    nlreturn:
      block-size: 3

    gocyclo:
      min-complexity: 10

    gocognit:
      min-complexity: 15

    nestif:
      min-complexity: 4

    dupl:
      threshold: 100

    revive:
      rules:
        - name: blank-imports
        - name: errorf
        - name: error-naming
        - name: error-return
        - name: exported
          disabled: true

    gocritic:
      enabled-checks:
        - appendAssign
        - argOrder
        - assignOp
        - badCall
        - badCond
        - captLocal
        - caseOrder
        - defaultCaseOrder
        - dupArg
        - dupBranchBody
        - dupCase
        - elseif
        - exitAfterDefer
        - flagDeref
        - flagName
        - hugeParam
        - ifElseChain
        - mapKey
        - nestingReduce
        - nilValReturn
        - regexpMust
        - sloppyLen
        - switchTrue
        - truncateCmp
        - typeSwitchVar
        - underef
        - unnecessaryBlock
        - weakCond

    testifylint:
      enable-all: true

formatters:
  enable:
    - gofumpt
    - goimports
    - golines

  settings:
    gofumpt:
      extra-rules: true

    golines:
      max-len: 120
      tab-len: 4
      shorten-comments: false
      reformat-tags: true
      chain-split-dots: true
